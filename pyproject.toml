[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-risk-platform"
version = "0.1.0"
description = "Provenance-first sovereign economic data and risk intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
ml = ["pandas>=2.2,<4", "numpy>=2,<3", "scikit-learn>=1.6,<2", "xgboost>=3,<4", "shap>=0.47,<1", "joblib>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["backend*", "ingestion*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
