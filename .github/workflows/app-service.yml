name: App Service
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: Existing Azure App Service name
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Check shared hosting and packaging
        run: python -m pytest -q backend/tests/test_frontend.py backend/tests/test_app_service_package.py
      - name: Create one deployment ZIP
        run: python scripts/package_app_service.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-service
          path: dist/app-service.zip
          retention-days: 7

  # A push builds an artifact only. Deployment requires an explicit manual run.
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    environment: azure-app-service
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-service
          path: package
      - name: Check Azure connection settings
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo 'Configure the Azure IDs in the azure-app-service GitHub environment first.'
            exit 1
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name }}
          package: package/app-service.zip
