name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sovereign_test
          POSTGRES_USER: sovereign
          POSTGRES_PASSWORD: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sovereign -d sovereign_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sovereign:ci_only@localhost:5432/sovereign_test
      TEST_DATABASE_URL: postgresql+psycopg://sovereign:ci_only@localhost:5432/sovereign_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock -e '.[dev]'
      - run: python -m pip check
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
